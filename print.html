<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RA9MANA — Imprimer</title>
<style>
*{box-sizing:border-box}html,body{margin:0;padding:0;background:#e5e7eb;color:#111827}body{font-family:Georgia,"Times New Roman",serif}.print-page{position:relative;width:210mm;height:297mm;min-height:297mm;margin:0 auto 10mm;background:#fff;padding:22mm 20mm 34mm;overflow:hidden;page-break-after:always}.print-page::after{content:'';position:absolute;inset:var(--page-border-inset,0);border:var(--page-border-width,0) var(--page-border-style,none) var(--page-border-color,#cbd5e1);pointer-events:none;box-sizing:border-box}.print-page:last-child{page-break-after:auto}.print-content{font-size:17px;line-height:1.85;direction:inherit;unicode-bidi:plaintext}.print-content .reference-marker{vertical-align:super;font-size:.72em;line-height:0}.print-footnotes{position:absolute;left:20mm;right:20mm;bottom:12mm;border-top:1px solid #1e293b;padding-top:8px;font-size:12px;line-height:1.5}.print-footnote{margin:4px 0;display:flex;flex-direction:row;direction:rtl;align-items:flex-start;gap:6px;text-align:right}.print-footnote-text{flex:1;min-width:0;direction:rtl;unicode-bidi:plaintext}.bibliography-print{direction:rtl;text-align:right}.bibliography-title{font-family:Georgia,'Times New Roman',serif;font-size:24px;font-weight:700;text-align:center;margin:18mm 0 12mm}.bibliography-entry{display:flex;flex-direction:row;direction:rtl;gap:8px;align-items:flex-start;margin:0 0 10px;font-size:16px;line-height:1.75}.bibliography-index{font-weight:700;min-width:24px;flex:0 0 auto}.bibliography-empty{color:#64748b;text-align:center;margin-top:60px}.print-number{font-weight:700;direction:rtl;unicode-bidi:normal;white-space:nowrap;min-width:18px;text-align:right;order:0;flex:0 0 auto}.missing{padding:30px;font-family:Arial,sans-serif;text-align:center}@page{size:A4;margin:0}@media print{html,body{background:#fff}.print-page{margin:0;box-shadow:none}.no-print{display:none!important}}
</style></head><body><main id="print-root"></main><script>
(function(){
'use strict';
const KEY='ra9mana-editor-projects-v1';
const root=document.getElementById('print-root');
function esc(s){return String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
function getProject(){try{const id=new URLSearchParams(location.search).get('project');const list=JSON.parse(localStorage.getItem(KEY)||'[]');return list.find(p=>String(p.id)===String(id))||list[0]||null}catch(e){return null}}
function render(){const p=getProject();if(!p){root.innerHTML='<div class="missing">لم يتم العثور على البحث المحفوظ.</div>';return false}root.innerHTML='';(p.pages||[]).forEach((pg,i)=>{const page=document.createElement('section');page.className='print-page';const st=pg.style||{};page.style.border='none';page.style.setProperty('--page-border-width',`${Number(st.borderWidth)||1}px`);page.style.setProperty('--page-border-style',st.borderStyle||'none');page.style.setProperty('--page-border-color',st.borderColor||'#cbd5e1');page.style.setProperty('--page-border-inset',`${Number(st.borderInset)||10}mm`);const gapMm=Math.max(1,Math.min(3,Number(st.borderTextGap)||2))*5;const contentInsetMm=(Number(st.borderInset)||10)+gapMm;page.style.padding=`${contentInsetMm}mm ${contentInsetMm}mm 34mm`;if(pg.isBibliography===true){const content=document.createElement('div');content.className='print-content bibliography-print';content.innerHTML='<div class="bibliography-title">قائمة المراجع</div>';const entries=Array.isArray(pg.bibliographyEntries)?pg.bibliographyEntries:[];if(entries.length)entries.forEach((text,j)=>{const item=document.createElement('div');item.className='bibliography-entry';item.innerHTML='<span>'+esc(text)+'</span>';content.appendChild(item)});else{const empty=document.createElement('div');empty.className='bibliography-empty';empty.textContent='ستظهر هنا المراجع المستخدمة في البحث تلقائيًا.';content.appendChild(empty)}page.appendChild(content);root.appendChild(page);return}const content=document.createElement('div');content.className='print-content';content.style.fontFamily=st.fontFamily||'Georgia';content.style.fontSize=`${Number(st.fontSize)||17}px`;content.style.color=st.color||'#1e293b';content.innerHTML=pg.html||'';page.appendChild(content);const notes=Array.isArray(pg.footnotes)?pg.footnotes:[];if(notes.length){const box=document.createElement('div');box.className='print-footnotes';notes.forEach((n,j)=>{const item=document.createElement('div');item.className='print-footnote';item.innerHTML='<span class="print-number">'+(j+1)+'.</span><span class="print-footnote-text">'+esc(n.text||'')+'</span>';box.appendChild(item)});page.appendChild(box)}root.appendChild(page)});return true}
function waitForImages(){const imgs=[...document.images];return Promise.all(imgs.map(i=>i.complete?Promise.resolve():new Promise(r=>{i.onload=i.onerror=r})));}
async function start(){if(!render())return;try{if(document.fonts&&document.fonts.ready)await document.fonts.ready}catch(e){}await waitForImages();setTimeout(()=>{window.focus();window.print()},350)}
window.addEventListener('afterprint',()=>setTimeout(()=>{try{window.close()}catch(e){}},150));
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',start);else start();
})();</script></body></html>
